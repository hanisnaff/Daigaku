name: Daigaku checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Check JavaScript syntax
        run: node --check js/app.js
      - name: Run app smoke tests
        run: node --test tests/*.test.mjs
